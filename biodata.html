<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <!-- CSS Global -->
    <link rel="stylesheet" href="style.css">
    <!-- CSS Khusus Halaman -->

</head>
<body>
    <header>
        <h1>Biodata Saya</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="biodata.html" class="active">Biodata</a></li>
                <li><a href="tentang.html">Tentang Saya</a></li>
                <li><a href="hobby.html">Hobi</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="biodata-form">
            <h2>Biodata Saya</h2>
            <form>
                <div class="form-group">
                    <label for="fullname">Nama Lengkap:</label>
                    <input type="text" id="fullname" name="fullname" value="Zahwa Anritia" readonly>
                </div>
                <div class="form-group">
                    <label for="birthdate">Tanggal Lahir:</label>
                    <input type="date" id="birthdate" name="birthdate" value="2006-12-12" readonly>
                </div>
                <div class="form-group">
                    <label for="address">Alamat:</label>
                    <textarea id="address" name="address" rows="3" readonly>Jl. Anggrek No. 123, Kota Bandung</textarea>
                </div>
                <div class="form-group">
                    <label for="education">Pendidikan:</label>
                    <select id="education" name="education" disabled>
                        <option value="sma">SMA</option>
                        <option value="diploma">Diploma</option>
                        <option value="s1" selected>S1</option>
                        <option value="s2">S2</option>
                    </select>
                </div>
            </form>
        </section>

    </main>
